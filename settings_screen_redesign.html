
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cinzel+Decorative:wght@400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap');

  .phone {
    width: 390px;
    margin: 0 auto;
    background: #080314;
    border-radius: 40px;
    border: 1px solid #2a1545;
    overflow: hidden;
    font-family: 'Cinzel', serif;
    position: relative;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 52px 24px 16px;
    background: #0d0520;
    border-bottom: 0.5px solid rgba(200,146,42,0.15);
  }

  .back-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(200,146,42,0.08);
    border: 0.5px solid rgba(200,146,42,0.2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  .screen-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 15px;
    color: #e8c060;
    letter-spacing: 3px;
  }

  .gear-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(200,146,42,0.08);
    border: 0.5px solid rgba(200,146,42,0.2);
    display: flex; align-items: center; justify-content: center;
  }

  .scroll-body {
    padding: 24px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: #080314;
  }

  .profile-card {
    background: #0f0825;
    border: 0.5px solid rgba(200,146,42,0.2);
    border-radius: 20px;
    padding: 28px 20px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    position: relative;
  }

  .avatar-ring {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #c8922a, #f0d060, #e8a030, #ffd060, #c8922a);
    padding: 2px;
    position: relative;
  }

  .avatar-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #1e0d40, #0a0520);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel Decorative', serif;
    font-size: 28px;
    color: #e8c060;
  }

  .camera-badge {
    position: absolute;
    bottom: 2px; right: 2px;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #1a0a35;
    border: 1.5px solid #c8922a;
    display: flex; align-items: center; justify-content: center;
  }

  .profile-name-row {
    display: flex; align-items: center; gap: 8px;
  }

  .profile-name {
    font-size: 20px;
    font-weight: 600;
    color: #f0e0b0;
    letter-spacing: 1px;
  }

  .edit-icon {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(200,146,42,0.12);
    border: 0.5px solid rgba(200,146,42,0.3);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  .sign-badge {
    display: flex; align-items: center; gap: 6px;
    background: rgba(120,80,200,0.15);
    border: 0.5px solid rgba(140,100,220,0.3);
    border-radius: 20px;
    padding: 4px 12px;
  }

  .sign-symbol {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(140,100,220,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: #b090e8;
  }

  .sign-name {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: #b090e8;
    letter-spacing: 0.5px;
  }

  .date-pill {
    background: rgba(200,146,42,0.08);
    border: 0.5px solid rgba(200,146,42,0.2);
    border-radius: 20px;
    padding: 6px 16px;
    font-family: 'EB Garamond', serif;
    font-size: 14px;
    color: rgba(200,170,100,0.8);
    letter-spacing: 0.5px;
  }

  .divider {
    width: 100%;
    height: 0.5px;
    background: rgba(200,146,42,0.12);
  }

  .birth-row {
    display: flex;
    width: 100%;
    gap: 0;
  }

  .birth-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 8px 0;
  }

  .birth-col:first-child {
    border-right: 0.5px solid rgba(200,146,42,0.12);
  }

  .birth-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: rgba(200,146,42,0.5);
    text-transform: uppercase;
  }

  .birth-value {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: rgba(200,170,120,0.5);
  }

  .birth-value.set {
    color: rgba(200,170,120,0.9);
  }

  .section-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(200,146,42,0.4);
    text-transform: uppercase;
    padding-left: 4px;
  }

  .card {
    background: #0f0825;
    border: 0.5px solid rgba(200,146,42,0.15);
    border-radius: 16px;
    overflow: hidden;
  }

  .lang-toggle {
    display: flex;
    padding: 6px;
    gap: 4px;
  }

  .lang-opt {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    text-align: center;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .lang-opt.active {
    background: rgba(200,146,42,0.15);
    border: 0.5px solid rgba(200,146,42,0.35);
    color: #e8c060;
  }

  .lang-opt.inactive {
    color: rgba(200,170,120,0.35);
  }

  .list-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    cursor: pointer;
  }

  .list-row + .list-row {
    border-top: 0.5px solid rgba(200,146,42,0.08);
  }

  .row-icon {
    width: 34px; height: 34px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .row-icon.danger {
    background: rgba(180,40,40,0.12);
    border: 0.5px solid rgba(180,40,40,0.2);
  }

  .row-icon.neutral {
    background: rgba(200,146,42,0.08);
    border: 0.5px solid rgba(200,146,42,0.15);
  }

  .row-text { flex: 1; }

  .row-title {
    font-size: 14px;
    color: #f0e0b0;
    letter-spacing: 0.3px;
    margin-bottom: 2px;
  }

  .row-title.danger { color: #e05050; }

  .row-sub {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 12px;
    color: rgba(200,170,120,0.4);
    letter-spacing: 0.2px;
  }

  .row-sub.danger { color: rgba(200,80,80,0.5); }

  .chevron {
    color: rgba(200,146,42,0.3);
    font-size: 14px;
  }
</style>
